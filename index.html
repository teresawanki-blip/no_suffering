<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>人類行為三苦防爆系統</title>
  <!-- 引入 Vue 3 同 Tailwind CSS -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-gray-800 font-sans p-6">
  <div id="app" class="max-w-3xl mx-auto">
    <h1 class="text-3xl font-bold text-center mb-2">🧘 佛法三苦防爆儀表板</h1>
    <p class="text-center text-gray-500 mb-8">為你最近的行為打分 (1-10分)，即時診斷你的能量狀態</p>

    <!-- 儀表板與警告區 -->
    <div v-if="kuKuAlert" class="bg-red-100 border-l-4 border-red-500 text-red-700 p-4 mb-8 shadow-sm">
      <h3 class="font-bold text-lg">🔥 苦苦爆發預警！(嚴重高利貸)</h3>
      <p>診斷：你的【執行力 2A】過度壓迫了【人際同理 3A】。你正在用完美主義框死宇宙。</p>
      <p class="mt-2 font-bold">💊 即時解藥：請調用 3A (第52條) - 閉嘴聽對方講完 3 分鐘。</p>
    </div>

    <!-- 評分列表區 -->
    <div class="bg-white rounded-lg shadow p-6">
      <h2 class="text-xl font-bold mb-4 border-b pb-2">📋 核心行為自我評分</h2>
      
      <div v-for="item in behaviors" :key="item.id" class="flex items-center justify-between py-3 border-b border-gray-100">
        <div class="flex-1">
          <span class="inline-block bg-slate-200 text-slate-700 text-xs px-2 py-1 rounded mr-2">{{ item.module }}</span>
          <span>{{ item.desc }}</span>
        </div>
        <div class="w-32 flex items-center">
          <input type="range" v-model.number="item.score" min="1" max="10" class="w-full mr-2">
          <span class="font-bold w-6 text-right">{{ item.score }}</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    const { createApp } = Vue;

    createApp({
      data() {
        return {
          // 這裡將會放入你完整的 100 條行為 JSON 數據
          behaviors: [
            { id: 1, module: '2A 秩序規範', desc: '精準把控微細瑕疵，追求零錯誤', score: 5 },
            { id: 2, module: '2A 秩序規範', desc: '追求極致工作效率，剔除浪費', score: 5 },
            { id: 3, module: '3A 同理傾聽', desc: '耐心傾聽不打斷，先聽對方講晒', score: 5 },
            { id: 4, module: '3A 同理傾聽', desc: '包容多元性格與價值觀', score: 5 }
          ]
        }
      },
      computed: {
        // 計算各模組平均分
        score2A() {
          const items = this.behaviors.filter(b => b.module === '2A 秩序規範');
          return items.reduce((sum, b) => sum + b.score, 0) / items.length;
        },
        score3A() {
          const items = this.behaviors.filter(b => b.module === '3A 同理傾聽');
          return items.reduce((sum, b) => sum + b.score, 0) / items.length;
        },
        // 計算高利貸指數 (超載端 / 壓抑端)
        tension1() {
          return this.score2A / Math.max(1, this.score3A);
        },
        // 觸發紅燈條件
        kuKuAlert() {
          return this.tension1 >= 2.5;
        }
      }
    }).mount('#app')
  </script>
</body>
</html>
